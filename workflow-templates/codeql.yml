name: CodeQL

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]
  schedule:
    # Weekly rescan picks up new CodeQL queries.
    - cron: "24 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
    uses: otpki/.github/.github/workflows/reusable-codeql.yml@v1
    with:
      languages: '[{"language":"actions","build-mode":"none"},{"language":"go","build-mode":"manual"}]'
      # For manual build-mode languages that need more than `go build ./...`:
      # build-commands: |
      #   go build -buildvcs=false ./...
