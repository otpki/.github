name: check

on:
  push:
    branches: [$default-branch]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: otpki/.github/.github/workflows/reusable-go-check.yml@v1
    with:
      # Multiline commands run after checkout, Go, Just, and aqua setup.
      commands: |
        just format-check
        just lint
        just test-ci
        just tidy
      # Uncomment for multi-OS coverage:
      # os-matrix: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      # Uncomment to skip the aqua `just tools` step:
      # tools: false
