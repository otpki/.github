name: Feature request
description: An idea or improvement
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: TL;DR
      description: The one-line version.
      placeholder: "TL;DR: ..."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing today and why it matters to you.
    validations:
      required: true

  - type: textarea
    id: build
    attributes:
      label: What to build
      description: What it should do. A short list works well, and sketch the config or API if there is new surface.
      placeholder: |
        1. ...
        2. ...
        3. docs and examples updated
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done means
      description: How we can tell it works. A checklist is great.
      placeholder: |
        - [ ] ...
        - [ ] tests cover the new behavior
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Out of scope notes, alternatives you tried, links to vendor docs or standards.
    validations:
      required: false
