name: Dependency review (reusable)

# Shared dependency review for OTPKI repositories. Fails a pull request when
# the dependency diff adds vulnerable packages or denied licenses. Callers
# trigger on pull_request.
#
#   jobs:
#     dependency-review:
#       permissions:
#         contents: read
#       uses: otpki/.github/.github/workflows/reusable-dependency-review.yml@v1

on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: Minimum severity that fails the check (low, moderate, high, critical).
        required: false
        type: string
        default: high
      deny-licenses:
        description: Comma-separated license IDs that fail the check. Empty disables license checks.
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          deny-licenses: ${{ inputs.deny-licenses }}
