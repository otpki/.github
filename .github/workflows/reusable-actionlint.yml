name: Workflow lint (reusable)

# actionlint + zizmor over .github/ for repos that want their own workflows
# checked on PRs. Caller example:
#
#   on:
#     pull_request:
#       paths: ['.github/**']
#   jobs:
#     lint:
#       uses: otpki/.github/.github/workflows/reusable-actionlint.yml@v1

on:
  workflow_call:

permissions: {}

jobs:
  lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve Go version
        id: versions
        run: |
          if [ -f versions.json ]; then
            echo "go=$(jq -r .go versions.json)"
          else
            echo "go=stable"
          fi >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          check-latest: true
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - name: actionlint
        run: actionlint -oneline -ignore 'property "workflow_(ref|sha|repository|file_path)" is not defined' .github/workflows/*.y*ml .github/actions/*/action.y*ml 2>/dev/null || actionlint -oneline -ignore 'property "workflow_(ref|sha|repository|file_path)" is not defined' .github/workflows/*.y*ml
      - name: zizmor
        env:
          WF_REF: ${{ job.workflow_ref }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/otpki/.github/${WF_REF##*@}/templates/zizmor.yml" -o "${{ runner.temp }}/zizmor.yml"
          docker run --rm -v "$PWD:/repo" -v "${{ runner.temp }}/zizmor.yml:/zizmor.yml:ro" -w /repo ghcr.io/zizmorcore/zizmor:latest --config /zizmor.yml --format plain .github
